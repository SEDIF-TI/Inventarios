spring.application.name=inventarios

# ── Base de datos ─────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/db_inventario}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass123}

# ── JPA ───────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=sc_inventario
spring.jpa.open-in-view=false

# ── FLYWAY ────────────────────────────
spring.flyway.enabled=true
spring.flyway.schemas=sc_inventario
spring.flyway.default-schema=sc_inventario
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Perfil
spring.profiles.active=${SPRING_PROFILE:dev}