spring.application.name=inventarios

# ── Base de datos ─────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/db_inventario}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}

# ── JPA ───────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=sc_inventario
spring.jpa.open-in-view=false

# ── Paginación ────────────────────────
# max-page-size es el tope duro: sin él un cliente pide ?size=999999 y volvemos
# a volcar la tabla entera, que es justo lo que la paginación viene a evitar.
# Se fija en 500 para que coincida con MAX_IDS de ResguardoService: el flujo de
# impresión carga el conjunto filtrado en una página y de ahí selecciona los ids.
spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=500
spring.data.web.pageable.one-indexed-parameters=false

# ── Compresión HTTP ───────────────────
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# ── JWT ───────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

app.cors.allowed-origin=http://localhost:5173

# ── FLYWAY ────────────────────────────
spring.flyway.enabled=true
spring.flyway.schemas=sc_inventario
spring.flyway.default-schema=sc_inventario
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# Perfil
spring.profiles.active=${SPRING_PROFILE:dev}
